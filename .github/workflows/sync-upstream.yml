name: Sync upstream

# Keeps this fork on the latest upstream QobuzProxy release:
# 1. merges upstream main via GitHub's "sync fork" API,
# 2. sets the add-on version in ha-addon/config.yaml to the version in
#    pyproject.toml and adds a changelog entry,
# 3. starts the image build (pushes made with GITHUB_TOKEN do not trigger
#    push workflows, so the build is dispatched explicitly).
# A merge conflict, or upstream changes to .github/workflows/, make step 1 fail;
# then sync by hand with "Sync fork" on GitHub.

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync and bump
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Merge upstream main
        id: merge
        run: |
          result=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main)
          echo "$result"
          echo "merge_type=$(jq -r '.merge_type' <<< "$result")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump add-on version
        id: bump
        run: |
          app_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          addon_version=$(yq -r '.version' ha-addon/config.yaml)
          echo "app=${app_version} addon=${addon_version}"
          # 1.7.6 and packaging-only bumps like 1.7.6.1 count as up to date.
          case "$addon_version" in
            "$app_version" | "$app_version".*) app_version="" ;;
          esac
          if [ -z "$app_version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i "s/^version: \".*\"$/version: \"${app_version}\"/" ha-addon/config.yaml
          {
            echo "# Changelog"
            echo
            echo "## ${app_version}"
            echo
            echo "- Updated to upstream QobuzProxy ${app_version}."
            echo "  See https://github.com/leolobato/qobuz-proxy/releases for details."
            tail -n +2 ha-addon/CHANGELOG.md
          } > CHANGELOG.new && mv CHANGELOG.new ha-addon/CHANGELOG.md
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=${app_version}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: steps.bump.outputs.changed == 'true'
        run: |
          head=$(git rev-parse HEAD)
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$head" \
            --arg msg "chore(ha-addon): bump to ${{ steps.bump.outputs.version }}" \
            --arg cfg "$(base64 -w0 ha-addon/config.yaml)" \
            --arg log "$(base64 -w0 ha-addon/CHANGELOG.md)" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: "main"},
                expectedHeadOid: $head,
                message: {headline: $msg},
                fileChanges: {additions: [
                  {path: "ha-addon/config.yaml", contents: $cfg},
                  {path: "ha-addon/CHANGELOG.md", contents: $log}
                ]}
              }}}' > payload.json
          gh api graphql --input payload.json

      - name: Build images
        if: steps.merge.outputs.merge_type != 'none' || steps.bump.outputs.changed == 'true'
        run: gh workflow run ha-addon.yml --repo "$GITHUB_REPOSITORY" --ref main
